<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1F2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Armario">
<title>Mi Armario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF4EC;--card:#fff;--ink:#3A2418;--muted:#8B7666;--line:#EADFD3;
  --pri:#7A1F2B;--pri2:#B23A53;--coral:#F2735E;--mustard:#E9B23F;--sage:#5FA36B;
  --sky:#5B8DEF;--lilac:#9C7BD6;--pink:#E8729B;--teal:#2FA39A;--orange:#F29A2E;
  --shadow:0 6px 20px rgba(80,40,20,.08);--r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0}
#app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 120px}

/* ===== temas de temporada ===== */
:root,[data-theme="o"]{--bg:#FBF4EC;--ink:#3A2418;--muted:#8B7666;--line:#EADFD3;--pri:#7A1F2B;--pri2:#B23A53;--acc:#F2735E;--acc2:#E8729B;--soft1:#FFF9F3;--soft2:#FCEBE3;--soft3:#F7E9F6;--blob1:#F5A97F;--blob2:#C97B84;--blob3:#E9C46A}
[data-theme="i"]{--bg:#F2F5FB;--ink:#1E2740;--muted:#6B7591;--line:#DCE3F0;--pri:#2B3A67;--pri2:#4A5FA8;--acc:#6C8EF5;--acc2:#A98BE8;--soft1:#F8FAFF;--soft2:#E7EEFC;--soft3:#EFE8FB;--blob1:#A9C2F7;--blob2:#D3C4F5;--blob3:#BFE3F0}
[data-theme="p"]{--bg:#F5FAF2;--ink:#24361F;--muted:#6F7F68;--line:#DBE8D4;--pri:#3F8A55;--pri2:#6FB37A;--acc:#F28FB0;--acc2:#F2B83A;--soft1:#FBFFF8;--soft2:#E9F6E5;--soft3:#FDEEF4;--blob1:#BFE6C4;--blob2:#F7C1D6;--blob3:#FBE3A1}
[data-theme="v"]{--bg:#FFF8EC;--ink:#2E2A24;--muted:#857A6A;--line:#F1E3CC;--pri:#E0603A;--pri2:#F29A2E;--acc:#16A6A0;--acc2:#2FC4D9;--soft1:#FFFCF5;--soft2:#FFEFD6;--soft3:#E2F7F5;--blob1:#FFD27F;--blob2:#8FE0DA;--blob3:#FFAD94}
body,.sheet,.msheet .box,.sh-hdr{transition:background-color .4s}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:-1;pointer-events:none}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 0 16px;gap:10px}
.hello small{display:block;font-family:'Playfair Display',serif;font-size:20px;color:var(--muted)}
.hello h1{font-size:36px;line-height:1.05}
.wpill{background:#fff;border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);text-align:right;min-width:88px}
.wpill .wt{font-size:20px;white-space:nowrap}.wpill .wt b{font-size:22px}
.wpill div:last-child{font-size:11px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec-t h2{font-size:20px}.sec-t button{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;background:#fff;border:1.5px solid var(--line)}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:none;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 30%,transparent)}
.btn-col{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn-big{width:100%;padding:17px;font-size:16px;border-radius:18px}
.btn-sm{padding:8px 13px;font-size:13px}
.btn-danger{color:#B3261E;border-color:#F3C9C5}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row>.grow{flex:1}
.chip{padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri));color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.chips.wrap{flex-wrap:wrap;overflow:visible}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:12px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 0;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--c,var(--pri))}
.thopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:18px;padding:14px;margin-bottom:10px;border:2.5px solid transparent;box-shadow:var(--shadow)}
.thopt.on{border-color:var(--ink)}
.thopt .sw{display:flex}.thopt .sw i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:block}.thopt .sw i:first-child{margin-left:0}
.thopt b{display:block;font-size:16px}.thopt small{font-size:12px;opacity:.75}
.secgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:10px}
.secgrid button{background:#fff;border-radius:14px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 2px 8px rgba(80,40,20,.06);border:2px solid transparent}
.secgrid .e{font-size:21px;line-height:1.1}.secgrid b{font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}.secgrid small{font-size:10.5px;color:var(--muted)}
.secgrid button.on{background:var(--c);color:#fff}.secgrid button.on small{color:rgba(255,255,255,.85)}
.uwrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.uwrow:last-child{border-bottom:none}
.uwrow .e{font-size:22px;width:40px;height:40px;border-radius:12px;background:#E3F5F3;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.uwrow b{font-size:14px;display:block}.uwrow small{font-size:11.5px;color:var(--muted)}.uwrow .lw{color:#C0392B;font-weight:700}
.uwrow.low .e{background:#FDE3DF}
.uwrow .e .sk{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:17px}
.seg2{display:flex;background:#fff;border-radius:999px;padding:4px;margin:0 0 10px;box-shadow:var(--shadow)}
.seg2 button{flex:1;padding:8px 4px;border-radius:999px;font-size:12.5px;line-height:1.15;font-weight:600;color:var(--muted)}
.seg2 button.on{background:#2FA39A;color:#fff}
.uwrow .cnt{width:34px;height:34px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:18px;font-weight:600;color:var(--pri)}
.uwrow .num{min-width:34px;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;text-align:center}
.uwrow.low .num{color:#C0392B}
.sw{width:44px;height:26px;border-radius:13px;background:#E3D6CA;position:relative;flex:0 0 44px;transition:.2s}.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#E8729B}.sw.on i{left:21px}
.washbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,#E3F5F3,#E7EEFC);border-radius:18px;padding:12px 14px;margin-top:14px}
.washbar.warn{background:linear-gradient(120deg,#FDE8E4,#FFF1D6)}
.washbar .e{font-size:28px}.washbar b{font-size:14px;display:block}.washbar small{font-size:12px;color:var(--muted)}
.fch{gap:6px}.fch .chip{padding:6px 11px;font-size:12.5px}
.famgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.famgrid button{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:7px 10px;text-align:left;border:2px solid transparent;box-shadow:0 2px 8px rgba(80,40,20,.05)}
.famgrid .e{font-size:18px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,white);flex:0 0 30px}
.famgrid .t{flex:1;font-size:12.5px;font-weight:600;line-height:1.15}.famgrid .n{font-size:12px;color:var(--muted);font-weight:600}
.famgrid button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,white)}
.famgrid button.zero{opacity:.55}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vis{position:relative;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;width:100%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);background:#fff;container-type:inline-size}
.vis img{width:100%;height:100%;object-fit:cover;display:block}
.vis .em{font-size:26px;font-size:28cqi;width:54%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.vis.tall{aspect-ratio:3/4}
.vis.empty{background:repeating-linear-gradient(45deg,#fff,#fff 8px,#FBF1E8 8px,#FBF1E8 16px);box-shadow:inset 0 0 0 2px #EADFD3}
.vis.empty .em{color:var(--muted)}
.itile{position:relative;cursor:pointer;min-width:0}
.itile .fav{position:absolute;top:6px;right:6px;font-size:13px}
.itile .st{position:absolute;left:6px;top:6px;font-size:11px;background:#fff;border-radius:8px;padding:1px 5px}
.itile.dim .vis{opacity:.45}
.itile.sel .vis{outline:3px solid var(--pri);outline-offset:-3px}
.itile .ck{position:absolute;right:6px;bottom:26px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.lbl{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-t{display:flex;align-items:center;gap:8px;font-weight:600;margin:18px 0 8px;font-size:15px}
.grp-t i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.grp-t span{color:var(--muted);font-weight:400;font-size:12px}
/* look board */
.board{position:relative;display:grid;grid-template-columns:.78fr 2.5fr .78fr;gap:8px;align-items:center;background:linear-gradient(160deg,var(--soft1),var(--soft2) 60%,var(--soft3));border-radius:18px;padding:16px 8px}
.board .side{display:flex;flex-direction:column;gap:9px;align-items:center}
.board .mid{display:flex;flex-direction:column;gap:9px;align-items:center}
.board .slot{width:100%;cursor:pointer;transition:transform .15s}
.board .slot:active{transform:scale(.95)}
.board .side .slot{max-width:84px}
.board .pair{display:flex;align-items:center;justify-content:center;width:100%}
.board .pair .slot{max-width:158px}
.board .pair .slot.full,.board .pair .slot.swim{max-width:176px}
.board .pair .slot.outer,.board .pair .slot.cover{margin-left:-30px;transform:rotate(5deg);z-index:0;max-width:118px}
.board .pair .slot.top,.board .pair .slot.full,.board .pair .slot.swim{z-index:1}
.board .mid .slot.bottom{max-width:150px}
.board .mid .slot.shoes{max-width:118px}
.board .mid .slot.head{max-width:78px}
.zoomb{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px auto 0;font-size:13px;font-weight:600;color:var(--pri);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px}
.board.xl{grid-template-columns:.8fr 2.6fr .8fr;padding:18px 8px;gap:10px}
.board.xl .side{gap:12px}.board.xl .mid{gap:12px}
.board.xl .side .slot{max-width:110px}
.board.xl .pair .slot{max-width:210px}.board.xl .pair .slot.full,.board.xl .pair .slot.swim{max-width:230px}
.board.xl .pair .slot.outer,.board.xl .pair .slot.cover{max-width:160px;margin-left:-40px}
.board.xl .mid .slot.bottom{max-width:200px}.board.xl .mid .slot.shoes{max-width:150px}.board.xl .mid .slot.head{max-width:100px}
.zlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.zlist div{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;font-size:13px;box-shadow:var(--shadow)}
.zlist .vis{width:44px;flex:0 0 44px;border-radius:10px}
.zlist small{color:var(--muted);display:block}
.board.mini{grid-template-columns:1fr 1.9fr 1fr;gap:4px;padding:8px 4px;border-radius:14px}
.board.mini .side{gap:4px}.board.mini .mid{gap:4px}
.board.mini .side .slot{max-width:30px}.board.mini .vis{border-radius:8px}
.board.mini .pair .slot{max-width:58px}.board.mini .pair .slot.full{max-width:62px}
.board.mini .pair .slot.outer,.board.mini .pair .slot.cover{max-width:44px;margin-left:-12px}
.board.mini .mid .slot.bottom{max-width:52px}.board.mini .mid .slot.shoes{max-width:40px}.board.mini .mid .slot.head{max-width:28px}
.tag{display:inline-flex;gap:4px;align-items:center;background:#FFF1CF;color:#8A5A00;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.tag.sky{background:#E3ECFF;color:#2D55B5}.tag.pink{background:#FDE3EC;color:#A3325A}.tag.sage{background:#E2F2E5;color:#2F6E3B}
.lookhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.lookhead h3{font-size:19px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}
.acts .icon{flex:0 0 48px;padding:12px 0}
/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-width:56px}
#nav button .i{font-size:21px;filter:grayscale(1);opacity:.6;line-height:1}
#nav button.on{color:var(--pri);font-weight:600}
#nav button.on .i{filter:none;opacity:1}
#nav .plus{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pri));color:#fff;font-size:30px;margin-top:-28px;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 35%,transparent);display:flex;align-items:center;justify-content:center;min-width:0}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet .inner{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 50px}
.msheet{position:fixed;inset:0;background:rgba(40,20,10,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.msheet .box{background:var(--bg);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom));animation:up .22s}
.sh-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.sh-hdr h2{flex:1;text-align:center;font-size:20px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 40px}
.icon-btn.ghost{background:none;box-shadow:none}
.field{margin:14px 0}
.field>label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;outline:none}
.inp:focus{border-color:var(--pri)}
.h-title{font-size:30px;text-align:center;margin:8px 0 4px}
.h-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px}
/* events */
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ev{background:#fff;border-radius:18px;padding:14px 6px 12px;text-align:center;border:2px solid transparent;box-shadow:var(--shadow);transition:.15s}
.ev .e{font-size:28px;width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 20%,white)}
.ev span{font-size:12.5px;font-weight:600;display:block;line-height:1.2}
.ev.on{background:var(--c);color:#fff;transform:translateY(-2px)}
.ev.on .e{background:rgba(255,255,255,.28)}
.evgrp{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
/* trends */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.hscroll::-webkit-scrollbar{display:none}
.trend{flex:0 0 148px;height:188px;border-radius:18px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--a),var(--b));text-align:left;box-shadow:var(--shadow)}
.trend .big{position:absolute;top:8px;right:8px;font-size:44px}
.trend .ring{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);top:-50px;left:-50px}
.trend b{font-family:'Playfair Display',serif;font-size:17px;line-height:1.15}
.trend small{font-size:11px;opacity:.9;margin-top:2px}
.badge{display:inline-block;margin-top:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;align-self:flex-start}
.news{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.news img,.news .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 64px;background:linear-gradient(135deg,var(--pink),var(--lilac))}
.news b{font-size:14px;display:block}.news small{color:var(--muted);font-size:12px}
/* colors */
.ccgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 6px}
.cc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);text-align:center;line-height:1.1}
.cc i{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);display:block}
.cc.on i{box-shadow:0 0 0 3px var(--pri)}
.cc.on{color:var(--ink);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tchip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:#fff;border:2px solid transparent;font-size:11px;text-align:center;line-height:1.15;box-shadow:0 2px 8px rgba(80,40,20,.05)}
.tchip .e{font-size:24px}
.tchip.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 9%,white)}
.photo-box{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,var(--soft2),var(--soft3));aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.photo-box .frame{position:absolute;inset:14%;border:2.5px dashed rgba(255,255,255,.95);border-radius:18px;pointer-events:none}
.photo-box img{width:100%;height:100%;object-fit:contain;background:#fff}
.photo-box .pb{position:relative;z-index:2;display:flex;gap:10px}
.photo-box .chg{position:absolute;bottom:10px;right:10px;z-index:2;display:flex;gap:6px}
details.more{background:#fff;border-radius:16px;padding:4px 14px;margin:14px 0;box-shadow:var(--shadow)}

/* ---------- tiempo (Open-Meteo, gratis, sin clave) ---------- */
const RAIN_CODES = c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
const wEmoji = c => c == null ? '🌡️' : c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌦️' : '⛈️';
const TC_LBL = { cold: ['Frío','🥶'], cool: ['Fresco','🍂'], mild: ['Templado','🌤️'], hot: ['Calor','☀️'] };
const tcOf = t => t < 12 ? 'cold' : t < 18 ? 'cool' : t <= 25 ? 'mild' : 'hot';
const monthTc = date => ['cold','cold','cool','cool','mild','hot','hot','hot','mild','cool','cool','cold'][new Date(date + 'T12:00:00').getMonth()];
const seasonsFor = tc => ({ cold: ['o'], cool: ['p','o'], mild: ['p','v'], hot: ['v'] })[tc];
const fitsSeason = (i, tc) => seasonsFor(tc).some(s => i.seasons.includes(s));
const FR = { manana: ['Mañana','🌅',10], tarde: ['Tarde','🌇',17], noche: ['Noche','🌙',21] };

async function ensureGeo() {
  const p = S.profile; if (!p || p.lat || !p.city) return;
  try {
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name=' + encodeURIComponent(p.city));
    const j = await r.json(); const g = j.results && j.results[0];
    if (g) { p.lat = g.latitude; p.lon = g.longitude; p.cityName = g.name; await saveProfile(); }
  } catch (e) { }
}
async function refreshWeather(force) {
  if (!S.profile) return;
  if (S.fc && !force && Date.now() - S.fc.t < 3600e3) return;
  await ensureGeo(); const p = S.profile; if (!p.lat) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&current=temperature_2m,weather_code&timezone=auto&forecast_days=16`;
    const j = await (await fetch(u)).json();
    if (j.hourly) { const first = !S.fc; S.fc = { t: Date.now(), h: j.hourly, cur: j.current }; if (S.tab === 'hoy' && first) render(); }
  } catch (e) { }
}
function weatherAt(date, fr) {
  const h = S.fc && S.fc.h; if (!h) return null;
  const idx = h.time.indexOf(`${date}T${z2(FR[fr][2])}:00`); if (idx < 0) return null;
  return { t: Math.round(h.temperature_2m[idx]), pp: h.precipitation_probability[idx] || 0, code: h.weather_code[idx], wind: h.wind_speed_10m[idx] };
}
function buildCtx(date, fr, opts = {}) {
  const w = weatherAt(date, fr); const man = S.settings.manual;
  const tc = (man && man.date === date) ? man.tc : (w ? tcOf(w.t) : monthTc(date));
  return { date, fr, opts, w, tc, manual: !!(man && man.date === date),
    rain: w ? (w.pp >= 50 || RAIN_CODES(w.code)) : false,
    sun: w ? w.code <= 2 : (tc === 'hot' || tc === 'mild'), wind: w ? w.wind > 35 : false };
}
const ctxLabel = c => c.w && !c.manual ? `${wEmoji(c.w.code)} ${c.w.t}°${c.rain ? ' · lluvia' : ''}` : `${TC_LBL[c.tc][1]} ${TC_LBL[c.tc][0]}`;

/* =========================================================
   MOTOR DE LOOKS (reglas, sin IA)
   ========================================================= */
const goodPair = (a, b) => (COL[a] && COL[b] && COL[a].fam === COL[b].fam) || GOOD.has(a + '|' + b);
function harmony(items) {
  const cs = [...new Set(items.map(i => i.color).filter(Boolean))];
  const nn = cs.filter(c => COL[c] && !COL[c].n && c !== 'multi'); const multi = cs.includes('multi');
  let s = 0;
  if (nn.length === 0) s += multi ? 1.2 : 1.4; else if (nn.length === 1) s += multi ? 0.6 : 2;
  else if (nn.length === 2) s += goodPair(nn[0], nn[1]) ? 1.5 : -1.5; else s -= 3;
  const pats = items.filter(i => i.pattern && i.pattern !== 'liso').length; if (pats >= 2) s -= 2;
  return s;
}
function bestOf(arr, fn) { let best = null; arr.forEach(it => { const s = fn(it); if (!best || s > best.s) best = { item: it, s }; }); return best; }

function generate(ev, ctx, n = 3, rng = Math.random) {
  const fl = new Set(ev.fl); const pool = avail(); const P = S.profile;
  const sport = fl.has('sport'), swim = fl.has('swim'), beach = fl.has('beach') || swim;
  const comfy = fl.has('comfy') || !!ctx.opts.comoda;
  const noHeel = comfy || !!ctx.opts.sinTacones || fl.has('kids') || fl.has('outdoor');
  const up = ctx.opts.arreglada ? 1 : 0;
  const comfortShift = (P.comfort ?? 50) > 65 ? -0.3 : (P.comfort ?? 50) < 35 ? 0.3 : 0;
  const want = (ev.fmin + ev.fmax) / 2 + up - (ctx.opts.comoda ? 0.5 : 0) + comfortShift;
  const fOk = (i, tol = 1) => i.f >= ev.fmin - tol && i.f <= ev.fmax + tol + up;
  const sOk = i => fitsSeason(i, ctx.tc);
  const colOk = i => !(fl.has('nowhite') && ['blanco','crema'].includes(i.color) && gender() !== 'm') && !(fl.has('dark') && !DARK.includes(i.color));
  const pref = (arr, f) => { const r = arr.filter(f); return r.length ? r : arr; };
  const slotOf = i => ty(i).slot; const secOf = i => ty(i).sec;
  const forced = ctx.opts.useItem ? itemById(ctx.opts.useItem) : null;
  const night = ctx.fr === 'noche';

  let tops = [], bottoms = [], fulls = [], swims = [], covers = [];
  if (beach) {
    swims = pool.filter(i => slotOf(i) === 'swim');
    swims = pref(swims, i => swim ? secOf(i) === 'deporte' : secOf(i) !== 'deporte');
    covers = swim ? [] : pool.filter(i => slotOf(i) === 'cover');
  } else if (sport) {
    const sp = pool.filter(i => secOf(i) === 'deporte');
    tops = sp.filter(i => slotOf(i) === 'top'); bottoms = sp.filter(i => slotOf(i) === 'bottom');
    if (!tops.length) tops = pool.filter(i => ['cam_mc','cam_basica','cam_ml','sudadera','tirantes','sin_mangas'].includes(i.type));
    if (!bottoms.length) bottoms = pool.filter(i => ['leggings','shorts','bermudas'].includes(i.type));
    tops = pref(tops, sOk); bottoms = pref(bottoms, sOk);
  } else {
    const m = pool.filter(i => secOf(i) === 'ropa' && ['top','bottom','full'].includes(slotOf(i)) && colOk(i) && fOk(i) && (!comfy || i.f <= 4));
    const enough = a => a.some(i => slotOf(i) === 'full') || (a.some(i => slotOf(i) === 'top') && a.some(i => slotOf(i) === 'bottom'));
    let ms = m.filter(sOk); if (!enough(ms)) ms = m;
    tops = ms.filter(i => slotOf(i) === 'top'); bottoms = ms.filter(i => slotOf(i) === 'bottom'); fulls = ms.filter(i => slotOf(i) === 'full');
  }
  if (forced) {
    const sl = slotOf(forced);
    if (sl === 'top') { tops = [forced]; fulls = []; } else if (sl === 'bottom') { bottoms = [forced]; fulls = []; }
    else if (sl === 'full') { fulls = [forced]; tops = []; bottoms = []; } else if (sl === 'swim') swims = [forced];
  }

  // calzado
  let shoes = [];
  if (!fl.has('noshoes')) {
    let sh = pool.filter(i => slotOf(i) === 'shoes');
    if (beach) shoes = sh.filter(i => ['chanclas','sandalias','alpargatas'].includes(i.type));
    else if (sport) { shoes = sh.filter(i => secOf(i) === 'deporte'); if (!shoes.length) shoes = sh.filter(i => ['deportivas','zapatillas_blancas'].includes(i.type)); }
    else {
      sh = sh.filter(i => secOf(i) !== 'deporte' && fOk(i, 1) && colOk(i));
      if (noHeel) sh = sh.filter(i => !ty(i).fl.includes('heel'));
      if (ctx.rain) sh = pref(sh, i => !ty(i).fl.includes('open') && i.fabric !== 'ante');
      sh = pref(sh, sOk);
      if (fl.has('outdoor')) sh = pref(sh, i => ty(i).fl.includes('comfy'));
      shoes = sh;
    }
  }
  if (forced && slotOf(forced) === 'shoes') shoes = [forced];

  // bases (combinaciones principales)
  let bases = [];
  if (beach) swims.forEach(s => bases.push([s]));
  else {
    fulls.forEach(f => bases.push([f]));
    let pairs = []; tops.forEach(t => bottoms.forEach(b => pairs.push([t, b])));
    if (pairs.length > 900) pairs = shuffle(pairs, rng).slice(0, 900);
    bases = bases.concat(pairs);
  }
  if (!bases.length) {
    const msg = beach ? 'Añade un bikini o bañador a tu armario.' : sport ? 'Añade ropa de deporte (o camisetas y leggings).' :
      'No encuentro una parte de arriba y una de abajo (o un vestido) que encaje con este plan y este tiempo.';
    return { looks: [], missing: msg };
  }

  const scorePiece = i => {
    let s = -Math.abs(i.f - want) * 0.7;
    if (i.fav) s += 0.6; if (isTrendy(i)) s += 0.5;
    if ((P.fav || []).includes(i.color)) s += 0.5;
    if ((i.occ || []).includes(ev.grp)) s += 0.3;
    const u = usage(i.id);
    const d = u.last ? daysBetween(u.last, ctx.date) : 45;
    if (u.last && d >= 0 && d < 3) s -= 1.5;
    s += Math.min(Math.max(d, 0), 60) / 60 * 0.8;
    if (fl.has('party') && ['saten','terciopelo','lentejuelas','encaje','seda'].includes(i.fabric)) s += 1;
    if (fl.has('date') && (i.fav || isTrendy(i))) s += 0.5;
    if (fl.has('kids') && ['blanco','crema'].includes(i.color)) s -= 1;
    if (fl.has('sober') && ((i.pattern && i.pattern !== 'liso') || !COL[i.color] || !COL[i.color].n)) s -= 0.7;
    if (ctx.wind && ['falda_corta','vestido_corto','falda_larga','vestido_largo'].includes(i.type)) s -= 0.6;
    if (ctx.tc === 'cold' && ty(i).fl.includes('short')) s -= 1.5;
    return s;
  };
  const scoreMain = pieces => harmony(pieces) + pieces.reduce((a, i) => a + scorePiece(i), 0) / pieces.length * 1.5;
  const scoreShoe = (sh, pieces) => {
    let s = harmony(pieces.concat(sh)) * 0.6 - Math.abs(sh.f - want) * 0.7 + (sh.fav ? 0.4 : 0) + (isTrendy(sh) ? 0.4 : 0);
    const heel = ty(sh).fl.includes('heel');
    if ((fl.has('party') || fl.has('wed')) && heel) s += 0.8;
    if (comfy && ty(sh).fl.includes('comfy')) s += 0.8;
    const hasSkirt = pieces.some(i => ty(i).fl.includes('skirt') || ty(i).fl.includes('dress'));
    if (hasSkirt && ctx.tc === 'cold' && ty(sh).fam === 'Botas') s += 0.6;
    if (pieces.some(i => ty(i).fl.includes('short')) && ty(sh).fam === 'Botas') s -= 0.8;
    return s;
  };

  const scored = bases.map(b => {
    const J = ctx.opts.random ? 5 : 1.3;
    const sh = shoes.length ? bestOf(shoes, s => scoreShoe(s, b) + rng() * (ctx.opts.random ? 2.5 : 0.5)) : null;
    return { b, shoe: sh ? sh.item : null, s: scoreMain(b) + (sh ? sh.s : -0.5) + rng() * J };
  }).sort((a, b) => b.s - a.s);

  // elegir variedad
  const picked = []; const used = new Set();
  for (const c of scored) { if (picked.length >= n) break; if (c.b.some(i => used.has(i.id))) continue; picked.push(c); c.b.forEach(i => used.add(i.id)); }
  for (const c of scored) { if (picked.length >= n) break; if (!picked.includes(c)) picked.push(c); }

  const looks = picked.map(c => {
    const slots = {}; c.b.forEach(i => { slots[slotOf(i)] = i.id; }); if (c.shoe) slots.shoes = c.shoe.id;
    const pieces = c.b.concat(c.shoe ? [c.shoe] : []);
    if (beach && covers.length && rng() > 0.25) { const cv = bestOf(covers, i => harmony(pieces.concat(i)) + rng()); if (cv) { slots.cover = cv.item.id; pieces.push(cv.item); } }
    const outer = pickOuter(c.b, ev, ctx, pool, rng, fl, want); if (outer) { slots.outer = outer.id; pieces.push(outer); }
    Object.assign(slots, pickAcc(pieces, slots, ev, ctx, pool, rng, fl, want));
    return { slots, ev: ev.id, date: ctx.date, fr: ctx.fr, trendy: Object.values(slots).some(id => { const it = itemById(id); return it && isTrendy(it); }) };
  });
  return { looks };
}

function pickOuter(base, ev, ctx, pool, rng, fl, want) {
  if (fl.has('beach') || fl.has('swim')) return null;
  const sport = fl.has('sport'); const night = ctx.fr === 'noche';
  const warmth = i => ty(i).fl.includes('warm') ? 3 : ty(i).fl.includes('mid') ? 2 : 1;
  const hasSuit = base.some(i => ty(i).fl.includes('suit'));
  let need = false, opt = false, range = [1, 3];
  if (ctx.tc === 'cold') { need = true; range = [3, 3]; }
  else if (ctx.tc === 'cool') { need = ev.out > 0 || night; opt = true; range = [2, 3]; }
  else if (ctx.tc === 'mild') { opt = night || ev.out === 1 || fl.has('layer') || fl.has('work'); range = [1, 2]; }
  else { opt = fl.has('layer'); range = [1, 1]; }
  if (ctx.rain && ev.out > 0) need = true;
  if (hasSuit && ctx.tc !== 'cold') return null;
  if (!need && !opt) return null;
  const c = pool.filter(i => ty(i).slot === 'outer' && (sport ? ty(i).sec === 'deporte' : ty(i).sec !== 'deporte') && (sport || (i.f >= ev.fmin - 2 && i.f <= ev.fmax + 2)));
  let cc = c.filter(i => warmth(i) >= range[0] && warmth(i) <= range[1]);
  if (!cc.length && need) cc = c.filter(i => warmth(i) >= range[0] - 1);
  if (ctx.rain && ev.out > 0) { const r = cc.filter(i => ty(i).fl.includes('rain')); if (r.length) cc = r; }
  if (!cc.length) return null;
  const best = bestOf(cc, i => {
    let s = harmony(base.concat(i)) * 0.6 - Math.abs(i.f - want) * 0.6 + (i.fav ? 0.4 : 0) + (isTrendy(i) ? 0.5 : 0) + rng() * 0.8;
    if (fl.has('work') && i.type === 'blazer' && ctx.tc !== 'cold') s += 1.2;
    if (ctx.rain && i.fabric === 'ante') s -= 3;
    return s;
  });
  if (!need && best.s < 0) return null;
  return best.item;
}

function pickAcc(pieces, slots, ev, ctx, pool, rng, fl, want) {
  const out = {}; const sport = fl.has('sport'); const beach = fl.has('beach'); const swim = fl.has('swim');
  const day = ctx.fr !== 'noche';
  const of = slot => pool.filter(i => ty(i).slot === slot && (ty(i).sec !== 'deporte' || slot === 'bag'));
  const sc = i => harmony(pieces.concat(i)) * 0.5 + (i.fav ? 0.4 : 0) + (COL[i.color] && COL[i.color].n ? 0.3 : 0) - Math.abs(i.f - want) * 0.3 + rng() * 0.8;
  const best = arr => { const b = bestOf(arr, sc); return b ? b.item : null; };
  // bolso
  let pref;
  if (sport || swim) pref = ['bolsa_dep','mochila'];
  else if (beach) pref = ['rafia','shopper','bandolera'];
  else if (fl.has('smallbag') || fl.has('party')) pref = ['clutch','bolso_mano','bandolera'];
  else if (fl.has('work')) pref = ['shopper','bolso_mano','bandolera'];
  else if (fl.has('outdoor')) pref = ['mochila','rinonera'];
  else if (fl.has('kids') || ev.id === 'viaje') pref = ['mochila','bandolera','shopper'];
  else if (ev.id === 'concierto') pref = ['rinonera','bandolera'];
  else if (ev.fmax >= 4) pref = ['bolso_mano','clutch','bandolera'];
  else pref = ['bandolera','shopper','bolso_mano','mochila','rinonera'];
  const bags = pool.filter(i => ty(i).slot === 'bag' && pref.includes(i.type));
  if (bags.length) { const b = bestOf(bags, i => sc(i) + (pref.length - pref.indexOf(i.type)) * 0.6); out.bag = b.item.id; }
  // tiempo
  if (ctx.tc === 'cold' && ev.out > 0 && !sport && !beach) {
    const g = best(of('hands')); if (g) out.hands = g.id;
    const sc2 = best(of('neck').filter(i => i.type === 'bufanda')); if (sc2) out.neck = sc2.id;
    if (ev.fmax <= 3) { const h = best(of('head').filter(i => i.type === 'gorro')); if (h) out.head = h.id; }
  }
  if (ctx.sun && day && ev.out > 0) { const e = best(of('eyes')); if (e) out.eyes = e.id; }
  if (!out.head && (beach || (ctx.sun && day && ev.out === 1 && ['hot','mild'].includes(ctx.tc) && ev.fmax <= 3))) {
    const h = best(of('head').filter(i => sport ? i.type === 'gorra' : ['sombrero_paja','gorra'].includes(i.type))); if (h && (beach || rng() < 0.7)) out.head = h.id;
  }
  if (fl.has('wed') && day && !out.head && rng() < 0.6) { const h = best(of('head').filter(i => i.type === 'tocado')); if (h) out.head = h.id; }
  if (!sport && !beach && !swim) {
    if (!out.neck) {
      const top = itemById(slots.top); const formalTop = slots.full ? ty(itemById(slots.full)).fl.includes('suit') : top && ['camisa','camisa_lino'].includes(top.type);
      if (gender() === 'm' && ev.fmax >= 4 && formalTop) { const t = best(of('neck').filter(i => i.type === 'corbata')); if (t) out.neck = t.id; }
      if (!out.neck && ctx.tc === 'cool' && ev.out > 0 && rng() < 0.55) { const p = best(of('neck').filter(i => i.type === 'panuelo')); if (p) out.neck = p.id; }
      if (!out.neck && ev.fmax >= 3) { const c = best(of('neck').filter(i => i.type === 'collar')); if (c) out.neck = c.id; }
      if (!out.neck && ev.fmax >= 3 && rng() < 0.3) { const p = best(of('neck').filter(i => i.type === 'panuelo')); if (p) out.neck = p.id; }
    }
    if (ev.fmax >= 3) { const e = best(of('ears')); if (e) out.ears = e.id; }
    if (ev.fmax >= 2) { const w = best(of('wrist')); if (w) out.wrist = w.id; }
    const bot = itemById(slots.bottom);
    if (bot && ['vaqueros','vaqueros_anchos','chinos','pinza','pana','falda_midi','falda_cuero','falda_larga','falda_vaquera','culotte','palazzo','pantalon_lino'].includes(bot.type) && rng() < 0.55) {
      const b = best(of('waist')); if (b) out.waist = b.id;
    }
    const legsy = (bot && ty(bot).fl.includes('skirt')) || (slots.full && ty(itemById(slots.full)).fl.includes('dress'));
    if (['cold','cool'].includes(ctx.tc) && legsy && ev.fmax >= 3) { const m = best(of('legs')); if (m) out.legs = m.id; }
  }
  // máximo 5 complementos
  const prio = ['bag','hands','neck','eyes','head','legs','ears','wrist','waist'];
  const keep = prio.filter(k => out[k]).slice(0, 5); const res = {}; keep.forEach(k => res[k] = out[k]);
  return res;
}

function board(look, mode = 'view', li = 0) {
  const sl = look.slots || {};
  const click = slot => mode === 'res' ? `onclick="swapSlot(${li},'${slot}')"` : mode === 'build' ? `onclick="buildPick('${slot}')"` : '';
  const t = (slot, cls = '', extra = '') => {
    const it = sl[slot] ? itemById(sl[slot]) : null;
    if (!it && mode !== 'build') return '';
    return `<div class="slot ${slot} ${extra}" ${click(slot)}>${vis(it, cls)}</div>`;
  };
  const showMain = mode === 'build' ? (look.mode || 'pair') : (sl.full ? 'full' : sl.swim ? 'swim' : 'pair');
  let mid = t('head');

// al ponerse un look: resta ropa interior y calcetines
function consumeUW(look) {
  if (!uwOn()) return [];
  const ev = evById(look.ev); const fl = ev.fl || []; const g = gender();
  const shoes = look.slots && look.slots.shoes ? itemById(look.slots.shoes) : null;
  const sport = fl.includes('sport'); const water = fl.includes('beach') || fl.includes('swim');
  const used = [];
  const take = (ids, preferFirst) => {
    const us = ids.map(id => UW.find(u => u.id === id)).filter(u => u && uwAllowed(u) && !modeHides(u) && tracked(u));
    if (!us.length) return;
    let pick = preferFirst ? us.find(u => st(u.id).c > 0) : us.filter(u => st(u.id).c > 0).sort((a, b) => st(b.id).c - st(a.id).c)[0];
    if (!pick) { used.push({ u: us[0], none: true }); return; }
    const s = st(pick.id); s.c--; s.d++; used.push({ u: pick });
  };
  if (!water) {
    if (g !== 'm' && S.settings.period) take(['braguita_regla'], true);
    else if (uwMode('bottom') === 'gen') take(g === 'm' ? ['calzon_gen'] : g === 'f' ? ['braguitas_gen'] : ['braguitas_gen','calzon_gen'], true);
    else if (g === 'm') take(['boxer','slip']);
    else if (fl.includes('party') || fl.includes('date')) take(['tanga','brasilena','braguita','culotte_int'], true);
    else take(['braguita','culotte_int','brasilena','tanga']);
    if (g !== 'm' && uwMode('bra') === 'gen') take(['sujetador_gen'], true);
    else if (g !== 'm' && uwMode('bra') === 'det') take(sport ? ['sujetador_dep','sujetador'] : ['sujetador'], true);
  }
  const open = shoes && (ty(shoes).fl.includes('open') || ['alpargatas'].includes(shoes.type));
  const noSocks = water || fl.includes('noshoes') || open || !shoes;
  const dsocks = detSocks().filter(tracked);
  if (!noSocks && sockDet() && dsocks.length) {
    const t = shoes.type, fam = ty(shoes).fam;
    const lens = sport ? ['tobilleros','cortos','pinkis'] : ['salones','slingback','bailarinas','lona'].includes(t) ? ['pinkis','tobilleros']
      : ['mocasines','nauticos'].includes(t) ? ['pinkis','cortos','altos'] : ['zapatillas_blancas','deportivas'].includes(t) ? ['tobilleros','pinkis','cortos']
      : (fam === 'Botas' || ['cordones','zapato_vestir'].includes(t)) ? ['altos','cortos','tobilleros'] : ['cortos','tobilleros','altos','pinkis'];
    const ref = itemById(look.slots.bottom) || itemById(look.slots.full) || shoes;
    const darkC = ['negro','marino','gris','marron','botella','berenjena','burdeos','denim'];
    let cols = sport ? ['blanco','gris','negro'] : (shoes.color === 'blanco' && fam === 'Zapatillas') ? ['blanco','gris','beige']
      : lens[0] === 'pinkis' ? (isLight(COL[shoes.color] && COL[shoes.color].hex) ? ['beige','blanco','gris','negro'] : ['negro','marino','gris','beige'])
      : darkC.includes(ref.color) ? ['negro','marino','gris','marron'] : ['blanco','beige','gris','negro'];
    if (ev.fmax <= 2) cols = cols.concat(['multi']);
    const most = arr => arr.filter(s => st(s.id).c > 0).sort((a, b) => st(b.id).c - st(a.id).c)[0];
    let pick = null;
    for (const L of lens) {
      for (const C of cols) { pick = dsocks.find(s => s.len === L && s.color === C && st(s.id).c > 0); if (pick) break; }
      if (!pick) pick = most(dsocks.filter(s => s.len === L));
      if (pick) break;
    }
    if (!pick) pick = most(dsocks);
    if (!pick) used.push({ u: { ...dsocks[0], name: 'Calcetines' }, none: true }); else { const s = st(pick.id); s.c--; s.d++; used.push({ u: pick }); }
  } else if (!noSocks && !sockDet()) {
    take(['calcetines'], true);
  }
  return used;
}
async function afterWear(look, base) {
  const used = consumeUW(look); await saveSettings();
  let msg = base;
  const ok = used.filter(x => !x.none);
  if (ok.length) msg += '\n🧺 A la lavadora: ' + ok.map(x => x.u.emoji + ' ' + x.u.name.toLowerCase()).join(', ');
  const none = used.filter(x => x.none);
  if (none.length) msg += '\n⚠️ ¡Se te han acabado: ' + none.map(x => x.u.name.toLowerCase()).join(', ') + '!';
  const low = ok.filter(x => st(x.u.id).c <= x.u.low);
  if (low.length) msg += '\n⚠️ Quedan pocas: ' + low.map(x => `${x.u.name.toLowerCase()} (${st(x.u.id).c})`).join(', ') + '. ¡Pon una lavadora!';
  toast(msg, used.length ? 4200 : 2300);
}

function compress(file, max = 900) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.78)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  return html;
}
function renderCal() {
  const [y, m] = S.lk.month.split('-').map(Number); const first = new Date(y, m - 1, 1); const days = new Date(y, m, 0).getDate();
  const off = (first.getDay() + 6) % 7; const t = today();
  let cells = ['L','M','X','J','V','S','D'].map(d => `<div class="wd">${d}</div>`).join('');
  for (let i = 0; i < off; i++) cells += '<div class="d out"></div>';
  for (let d = 1; d <= days; d++) {
    const date = `${y}-${z2(m)}-${z2(d)}`; const ls = S.looks.filter(l => l.date === date && (l.worn || l.planned));
    const worn = ls.find(l => l.worn); const plan = ls.find(l => l.planned);
    let th = '';
    if (worn) { if (worn.photo) th = `<div class="th"><img src="${worn.photo}" style="width:100%;height:100%;object-fit:cover"></div>`; else { const it = itemById(worn.slots.full || worn.slots.top || worn.slots.swim || worn.items[0]); th = `<div class="th">${vis(it)}</div>`; } }
    cells += `<button class="d ${date === t ? 'today' : ''}" onclick="openDay('${date}')">${d}${th}${plan && !worn ? '<span class="dot"></span>' : ''}</button>`;
  }
  return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="icon-btn" onclick="calMove(-1)">‹</button><h2 style="font-size:20px;text-transform:capitalize">${MESES[m - 1]} ${y}</h2><button class="icon-btn" onclick="calMove(1)">›</button></div>
    <div class="cal">${cells}</div><p class="small muted center" style="margin-top:10px">Miniatura = lo que te pusiste · <span style="color:var(--coral)">●</span> = plan con look preparado</p>`;
}
function calMove(n) { const [y, m] = S.lk.month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); S.lk.month = d.getFullYear() + '-' + z2(d.getMonth() + 1); render(); }

  const data = { app: 'miarmario', v: 1, exported: new Date().toISOString(), profile: S.profile, settings: S.settings, items: S.items, looks: S.looks };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `mi-armario-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Copia descargada 💾');
}
async function importData(input) {
  const f = input.files && input.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (d.app !== 'miarmario') throw 0;
    if (!confirm(`¿Restaurar ${d.items.length} prendas y ${d.looks.length} looks? Se sustituirá lo que hay ahora.`)) return;
    await DB.clear('items'); await DB.clear('looks');
    for (const i of d.items) await DB.put('items', i); for (const l of d.looks) await DB.put('looks', l);
    S.items = d.items; S.looks = d.looks; S.profile = d.profile; S.settings = { stored: [], custom: [], ...d.settings, dayLook: null }; S._u = null;
    await saveProfile(); await saveSettings(); toast('Copia restaurada ✓'); render();
  } catch (e) { toast('Ese archivo no es una copia válida'); }
  input.value = '';
}
async function wipeAll() {
  if (!confirm('¿Borrar TODO (prendas, looks y perfil)? No se puede deshacer.')) return;
  await DB.clear('items'); await DB.clear('looks'); await DB.clear('kv');
  S.items = []; S.looks = []; S.profile = null; S.settings = { stored: [], custom: [], dayLook: null, manual: null, theme: S.settings.theme || 'auto' }; S._u = null;
  openOnboarding(false);
}

/* =========================================================
   BIENVENIDA (onboarding)
   ========================================================= */
function openOnboarding(edit) {
  S.ob = { step: 0, edit, d: edit ? JSON.parse(JSON.stringify(S.profile)) : { name: '', gender: '', age: '', city: '', styles: [], fav: [], hate: [], excl: [], comfort: 50, job: '' } };
  openSheet('ob', renderOb);
}
const OB_STEPS = [
  { t: d => '¡Hola! 👋<br>¿Cómo te llamas?', q: 'Así sabré a quién preparo los looks.', ok: d => d.name.trim(),
    b: d => `<input class="inp" style="font-size:20px;padding:16px" placeholder="Tu nombre" value="${esc(d.name)}" oninput="S.ob.d.name=this.value" onkeydown="if(event.key==='Enter')obNext()">` },
  { t: d => `Encantada, ${esc(d.name)} ✨<br>¿Cómo te identificas?`, q: 'Me sirve para enseñarte el catálogo de prendas adecuado.', ok: d => d.gender,
    b: d => [['f','Chica','👩','#E8729B'],['m','Chico','👨','#5B8DEF'],['x','Prefiero no decirlo','🌈','#9C7BD6']].map(o => `<button class="bigopt ${d.gender === o[0] ? 'on' : ''}" style="--c:${o[3]}" onclick="S.ob.d.gender='${o[0]}';rs('ob')"><span class="e">${o[2]}</span>${o[1]}</button>`).join('') },
  { t: () => '¿Cuántos años tienes?', q: 'Para afinar un poco las sugerencias.', ok: d => d.age,
    b: d => `<div class="chips wrap">${AGES.map(a => `<button class="chip ${d.age === a ? 'on' : ''}" style="font-size:16px;padding:12px 20px" onclick="S.ob.d.age='${a}';rs('ob')">${a}</button>`).join('')}</div>` },
  { t: () => '¿En qué ciudad vives? 🌤️', q: 'Miro el tiempo para que no pases frío ni calor.', ok: d => d.city || d.lat,
    b: d => `<input class="inp" style="font-size:18px;padding:16px" placeholder="Ej: Benidorm" value="${esc(d.city || '')}" oninput="S.ob.d.city=this.value;S.ob.d.lat=null;S.ob.d.cityName=null"><button class="btn" style="margin-top:12px" onclick="obGeo()">📍 Usar mi ubicación</button>${d.lat && d.cityName ? `<p class="small muted" style="margin-top:8px">✓ ${esc(d.cityName)}</p>` : ''}` },
  { t: () => '¿Con qué estilos te identificas?', q: 'Puedes marcar varios.', ok: d => d.styles.length,
    b: d => `<div class="chips wrap">${STYLES.map((s, k) => `<button class="chip ${d.styles.includes(s) ? 'on' : ''}" style="--c:${FAM_COLORS[k % FAM_COLORS.length]};font-size:15px;padding:11px 18px" onclick="obTog('styles','${s}')">${s}</button>`).join('')}</div>` },
  { t: () => 'Tus colores 🎨', q: 'Los favoritos los usaré más. Los que nunca te pones, no los sugeriré.', ok: () => true,
    b: d => `<div class="field"><label>💖 Me encantan</label>${obColors('fav')}</div><div class="field"><label>🚫 Nunca me pongo</label>${obColors('hate')}</div>` },
  { t: () => '¿Hay algo que no te pongas nunca?', q: 'Lo quitaré de las sugerencias. Si no, sigue.', ok: () => true,
    b: d => `<div class="chips wrap">${EXCL.filter(e => d.gender === 'm' ? ['animal','cuero'].includes(e.id) : true).map(e => `<button class="chip ${d.excl.includes(e.id) ? 'on' : ''}" style="--c:#B3261E;font-size:15px;padding:11px 18px" onclick="obTog('excl','${e.id}')">${e.l}</button>`).join('')}</div>` },
  { t: () => '¿Qué prefieres en el día a día?', q: 'Desliza hacia donde te sientas más tú.', ok: () => true,
    b: d => `<div style="font-size:40px;display:flex;justify-content:space-between;margin-bottom:8px"><span>🧸</span><span>💄</span></div><input type="range" min="0" max="100" value="${d.comfort}" oninput="S.ob.d.comfort=+this.value"><div class="seg" style="font-size:13px"><span>Comodidad ante todo</span><span>Siempre arreglada</span></div>` },
  { t: () => '¿Cómo es tu trabajo?', q: 'Para tu look de diario de lunes a viernes.', ok: d => d.job,
    b: d => JOBS.map((j, k) => `<button class="bigopt ${d.job === j[0] ? 'on' : ''}" style="--c:${FAM_COLORS[k % FAM_COLORS.length]}" onclick="S.ob.d.job='${j[0]}';rs('ob')"><span class="e">${j[2]}</span>${j[1]}</button>`).join('') }
];
function obColors(key) { const d = S.ob.d; return `<div class="ccgrid">${COLORS.map(c => `<button class="cc ${d[key].includes(c[0]) ? 'on' : ''}" onclick="obTog('${key}','${c[0]}')"><i style="background:${c[2] === 'multi' ? 'conic-gradient(#F2735E,#E9B23F,#5FA36B,#5B8DEF,#9C7BD6,#F2735E)' : c[2]}"></i>${c[1]}</button>`).join('')}</div>`; }
function obTog(key, v) { const d = S.ob.d; d[key] = d[key].includes(v) ? d[key].filter(x => x !== v) : d[key].concat(v); if (key === 'fav') d.hate = d.hate.filter(x => x !== v); if (key === 'hate') d.fav = d.fav.filter(x => x !== v); rs('ob'); }
function obGeo() {
  if (!navigator.geolocation) return toast('Tu móvil no permite la ubicación');
  navigator.geolocation.getCurrentPosition(p => { const d = S.ob.d; d.lat = p.coords.latitude; d.lon = p.coords.longitude; d.cityName = 'Mi ubicación'; d.city = d.city || 'Mi ubicación'; rs('ob'); }, () => toast('No he podido obtener la ubicación'));
}
function renderOb() {
  const o = S.ob; const d = o.d;
  if (o.step >= OB_STEPS.length) {
    return `<div class="ob"><div class="prog"><i style="width:100%"></i></div><div class="center" style="margin-top:40px"><div style="font-size:72px">👗✨</div>
      <h1>¡Todo listo, ${esc(d.name)}!</h1><p class="muted">Empieza añadiendo unas 10 prendas (mínimo una parte de arriba, una de abajo y unos zapatos) y te preparo tu primer look.</p></div>
      <div class="foot" style="flex-direction:column"><button class="btn btn-pri btn-big" onclick="obFinish('add')">＋ Añadir mis prendas</button><button class="btn btn-big" onclick="obFinish('demo')">🧪 Probar con un armario de ejemplo</button></div></div>`;
  }
  const st = OB_STEPS[o.step]; const ok = st.ok(d);
  return `<div class="ob"><div class="row" style="justify-content:space-between">${o.step > 0 ? `<button class="icon-btn" onclick="S.ob.step--;rs('ob')">‹</button>` : (o.edit ? `<button class="icon-btn" onclick="closeSheet('ob')">✕</button>` : '<span></span>')}
      <span class="small muted">${o.step + 1} / ${OB_STEPS.length}</span>${!o.edit && o.step > 0 ? `<button class="small muted" onclick="obSkip()">Saltar</button>` : '<span style="width:40px"></span>'}</div>
    <div class="prog"><i style="width:${(o.step + 1) / OB_STEPS.length * 100}%"></i></div>
    <h1>${st.t(d)}</h1><p class="q">${st.q}</p>${st.b(d)}
    <div class="foot">${o.edit ? `<button class="btn grow" onclick="obSave()">Guardar</button>` : ''}<button class="btn btn-pri btn-big grow" ${ok ? '' : 'style="opacity:.45"'} onclick="obNext()">${o.step === OB_STEPS.length - 1 ? (o.edit ? 'Guardar' : 'Terminar') : 'Siguiente'} ›</button></div></div>`;
}
function obNext() { const o = S.ob; const st = OB_STEPS[o.step]; if (!st.ok(o.d)) return toast('Responde para seguir 🙂'); if (o.edit && o.step === OB_STEPS.length - 1) return obSave(); o.step++; rs('ob'); const s = SH.find(x => x.id === 'ob'); if (s) s.el.scrollTop = 0; }
function obSkip() { const d = S.ob.d; d.gender = d.gender || 'f'; d.age = d.age || '26-35'; d.job = d.job || 'casual'; if (!d.styles.length) d.styles = ['Casual']; S.ob.step = OB_STEPS.length; rs('ob'); }
async function obSave() { const d = S.ob.d; const cityChanged = !S.profile || d.city !== S.profile.city; S.profile = { ...d, done: true }; if (cityChanged && d.cityName !== 'Mi ubicación') { S.profile.lat = null; S.profile.cityName = null; } await saveProfile(); S.settings.dayLook = null; await saveSettings(); S.fc = null; closeSheet('ob'); refreshWeather(true); toast('Datos guardados ✓'); }
async function obFinish(next) { S.profile = { ...S.ob.d, done: true }; await saveProfile(); closeSheet('ob', true); S.tab = 'hoy'; render(); refreshWeather(true); if (next === 'demo') loadDemo(); else openAdd('ropa'); }

/* ---------- noticias (opcional: noticias.json junto a la app) ---------- */
function loadNews() {
  fetch('noticias.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(a => { S.news = Array.isArray(a) ? a.slice(0, 12) : []; if (S.news.length && S.tab === 'hoy' && !SH.length) render(); }).catch(() => { });
}

/* ---------- PWA ---------- */
function setupPWA() {
  const icon = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2735E"/><stop offset="1" stop-color="#7A1F2B"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><path d="M256 150a34 34 0 1 1 34 34c-18 0-34 12-34 30v12l150 92c22 14 12 46-14 46H120c-26 0-36-32-14-46l150-92" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  const man = { name: 'Mi Armario', short_name: 'Armario', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#FBF4EC', theme_color: '#7A1F2B', icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })); document.head.appendChild(l);
  const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = icon; document.head.appendChild(a);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}

/* ---------- arranque ---------- */
async function init() {
  setupPWA();
  const ok = await DB.open(); if (!ok) setTimeout(() => toast('Modo temporal: los datos no se guardarán'), 800);
  const kv = await DB.all('kv'); const g = k => (kv.find(x => x.k === k) || {}).v;
  S.profile = g('profile') || null; S.settings = { stored: [], custom: [], dayLook: null, manual: null, theme: 'auto', ...(g('settings') || {}) };
  applyTheme();
  S.items = await DB.all('items'); S.looks = await DB.all('looks');
  if (!S.profile || !S.profile.done) openOnboarding(false);
  else { render(); refreshWeather(); }
  loadNews();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { applyTheme(); if (S.profile && S.profile.done) refreshWeather(); } });
}
init();
</script>
